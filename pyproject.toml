[project]
name = "pinax"
version = "0.1.0"
description = "A terminal-native intelligent document reader — PDF, DOCX, EPUB, Markdown, TXT, right inside your terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "rishabxx" }]
keywords = ["tui", "terminal", "pdf-reader", "textual", "reader", "cli", "ebook", "epub"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.89.0",
    "rich>=13.9.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "pydantic>=2.9.0",
    "click>=8.1.0",
    "platformdirs>=4.3.0",
    "textual-image>=0.13.2",
    "openai>=3.5.0",
    "anthropic>=1.1.0",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/rishabxx/pinax"
Repository = "https://github.com/rishabxx/pinax"
Issues = "https://github.com/rishabxx/pinax/issues"

[project.scripts]
pinax = "pinax.cli:main"
tr = "pinax.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "textual-dev>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinax"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
